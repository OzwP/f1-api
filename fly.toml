# Config for `fly launch` / `fly deploy`. Fill in `app` with the name you
# reserve on Fly, attach a Postgres instance with `fly postgres create` +
# `fly postgres attach`, then deploy.
app = "f1-api"
primary_region = "iad"

[build]

[env]
  FLASK_CONFIG = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
